<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bushra — Listen</title>
  <meta name="description" content="A quiet room for the Bushra recordings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #120c10;
      --panel: rgba(28, 16, 20, 0.78);
      --gold: #e4c27a;
      --gold-dim: rgba(228, 194, 122, 0.35);
      --rose: #c46b7a;
      --mist: #f4ead8;
      --line: rgba(244, 234, 216, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--mist);
      background:
        radial-gradient(900px 520px at 80% -10%, rgba(196, 107, 122, 0.22), transparent 60%),
        radial-gradient(700px 480px at 0% 100%, rgba(228, 194, 122, 0.12), transparent 55%),
        var(--ink);
      min-height: 100vh;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 18px 80px;
    }
    header { text-align: center; margin-bottom: 28px; }
    .kicker {
      letter-spacing: 0.34em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--gold);
      font-weight: 500;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(48px, 9vw, 84px);
      margin: 8px 0 0;
      line-height: 0.9;
    }
    .arabic {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      color: var(--gold);
      font-size: 22px;
      margin: 10px 0 0;
    }
    .sub {
      color: rgba(244, 234, 216, 0.68);
      font-weight: 300;
      margin: 10px auto 0;
      max-width: 460px;
      line-height: 1.5;
    }
    .stage {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 22px;
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }
    .disc-wrap { display: grid; place-items: center; }
    .disc {
      width: 188px;
      height: 188px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #1a1014 0 28px, transparent 29px),
        repeating-radial-gradient(circle at 50% 50%, #2a181c 0 2px, #140d10 3px 7px);
      border: 1px solid var(--gold-dim);
      box-shadow: 0 0 0 10px rgba(228, 194, 122, 0.05), 0 18px 40px rgba(0,0,0,0.4);
      position: relative;
      animation: spin 18s linear infinite;
      animation-play-state: paused;
    }
    .disc.spinning { animation-play-state: running; }
    .disc::after {
      content: "";
      position: absolute;
      inset: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #f0d7a4, #b8884a 55%, #6d4a28);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .now { min-width: 0; }
    .label {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--rose);
    }
    #title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(32px, 5vw, 48px);
      margin: 4px 0 18px;
      line-height: 1;
    }
    #meta { color: rgba(244, 234, 216, 0.6); font-weight: 300; margin-bottom: 18px; }
    .bar {
      height: 6px;
      background: rgba(244, 234, 216, 0.1);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rose), var(--gold));
    }
    .times {
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: rgba(244, 234, 216, 0.55);
      margin-top: 8px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--mist);
      border-radius: 999px;
      height: 44px;
      min-width: 44px;
      padding: 0 14px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--gold-dim); color: var(--gold); }
    #play {
      background: var(--mist);
      color: var(--ink);
      font-weight: 500;
      min-width: 92px;
    }
    #play:hover { color: var(--ink); background: var(--gold); }
    .vol { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(244,234,216,0.6); }
    input[type="range"] { accent-color: var(--gold); width: 90px; }
    .list { margin-top: 18px; display: grid; gap: 10px; }
    .track {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .track.active { border-color: var(--gold-dim); background: rgba(228, 194, 122, 0.08); }
    .num {
      flex: 0 0 36px;
      color: var(--gold);
      font-family: Outfit, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .t-title {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .play-mark { flex: 0 0 auto; color: var(--gold); font-size: 14px; }
    @media (max-width: 680px) {
      .stage { grid-template-columns: 1fr; }
      .disc { width: 150px; height: 150px; }
      .disc::after { inset: 58px; }
      .vol { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">For Bushra</div>
      <h1>Listen</h1>
      <p class="arabic">أحبك يا بشرى</p>
    </header>

    <section class="stage">
      <div class="disc-wrap"><div class="disc" id="disc"></div></div>
      <div class="now">
        <div class="label" id="state">Ready</div>
        <div id="title">Choose a track</div>
        <div class="bar" id="bar" role="slider" aria-label="Seek"><span id="fill"></span></div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="controls">
          <button id="prev" type="button" aria-label="Previous">Prev</button>
          <button id="play" type="button">Play</button>
          <button id="next" type="button" aria-label="Next">Next</button>
          <label class="vol">Vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" /></label>
        </div>
      </div>
    </section>

    <div class="list" id="list"></div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script>
    let tracks = [];

    const audio = document.getElementById("audio");
    const disc = document.getElementById("disc");
    const title = document.getElementById("title");
    const state = document.getElementById("state");
    const playBtn = document.getElementById("play");
    const fill = document.getElementById("fill");
    const cur = document.getElementById("cur");
    const dur = document.getElementById("dur");
    const list = document.getElementById("list");
    let index = 0;

    function fmt(s) {
      if (!Number.isFinite(s)) return "0:00";
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return m + ":" + String(r).padStart(2, "0");
    }

    function titleFrom(name) {
      return name.replace(/\.mp3$/i, "");
    }

    function renderList() {
      list.innerHTML = "";
      tracks.forEach((t, i) => {
        const btn = document.createElement("button");
        btn.className = "track" + (i === index ? " active" : "");
        btn.type = "button";
        btn.innerHTML = '<span class="num">' + String(i + 1).padStart(2, "0") + '</span><span class="t-title"></span><span class="play-mark">▶</span>';
        btn.querySelector(".t-title").textContent = t.title;
        btn.addEventListener("click", () => load(i, true));
        list.appendChild(btn);
      });
    }

    function load(i, autoplay) {
      if (!tracks.length) return;
      index = (i + tracks.length) % tracks.length;
      const t = tracks[index];
      title.textContent = t.title;
      audio.src = encodeURI(t.file);
      renderList();
      if (autoplay) audio.play().catch(() => {});
    }

    async function discover() {
      state.textContent = "Loading";
      title.textContent = "Finding tracks";
      const res = await fetch("https://api.github.com/repos/lukaweba19-cell/Bushra/contents/?ref=main", {
        headers: { Accept: "application/vnd.github+json" }
      });
      if (!res.ok) throw new Error("Could not list files");
      const items = await res.json();
      tracks = items
        .filter((f) => f.type === "file" && /\.mp3$/i.test(f.name))
        .map((f) => ({ title: titleFrom(f.name), file: f.name }))
        .sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: "base" }));
      if (!tracks.length) {
        title.textContent = "No tracks yet";
        state.textContent = "Empty";
        list.innerHTML = "";
        return;
      }
      state.textContent = "Ready";
      load(0, false);
    }

    playBtn.addEventListener("click", () => {
      if (!tracks.length) return;
      if (!audio.src) load(0, true);
      else if (audio.paused) audio.play();
      else audio.pause();
    });
    document.getElementById("prev").addEventListener("click", () => load(index - 1, true));
    document.getElementById("next").addEventListener("click", () => load(index + 1, true));
    document.getElementById("vol").addEventListener("input", (e) => { audio.volume = Number(e.target.value); });
    document.getElementById("bar").addEventListener("click", (e) => {
      if (!audio.duration) return;
      const r = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });
    audio.addEventListener("play", () => { playBtn.textContent = "Pause"; state.textContent = "Playing"; disc.classList.add("spinning"); });
    audio.addEventListener("pause", () => { playBtn.textContent = "Play"; state.textContent = "Paused"; disc.classList.remove("spinning"); });
    audio.addEventListener("timeupdate", () => {
      cur.textContent = fmt(audio.currentTime);
      dur.textContent = fmt(audio.duration);
      fill.style.width = audio.duration ? (audio.currentTime / audio.duration * 100) + "%" : "0%";
    });
    audio.addEventListener("ended", () => load(index + 1, true));
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); playBtn.click(); }
    });

    audio.volume = 0.9;
    discover().catch(() => {
      title.textContent = "Could not load tracks";
      state.textContent = "Retry";
    });
  </script>
</body>
</html>
